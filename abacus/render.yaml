# Render blueprint for the FastAPI backend. Frontend is deployed on Vercel (frontend/vercel.json).
services:
  - type: web
    name: frostroute-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SUPABASE_URL          # set in the Render dashboard (kept secret, not in git)
        sync: false
      - key: SUPABASE_PUBLIC_KEY   # set in the Render dashboard
        sync: false
      - key: FRONTEND_ORIGIN       # e.g. https://your-app.vercel.app
        sync: false
      - key: GEMINI_API_KEY
        sync: false
